  #girlyanda-catalog-prices {
    container-type: inline-size;
    color-scheme: light dark;
  }
  #girlyanda-catalog-prices .price-stage {
    --paper: light-dark(#f8f4ee, #28241f);
    --ink: light-dark(#302e26, #f9f2e8);
    --secondary-ink: light-dark(#61554a, #dccbb9);
    --line: light-dark(#d9cbbc, #5e5144);
    --photo-background: light-dark(#eee4d7, #342d26);
    --gap: clamp(8px, 1.8cqw, 16px);
    --card-padding: 14px;
    --title-size: clamp(14px, 2.45cqw, 20px);
    color: var(--ink);
    font: 400 14px/1.4 'Girlyanda Golos', system-ui, sans-serif;
    padding: var(--gap);
    min-inline-size: 0;
  }
  #girlyanda-catalog-prices .price-gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    column-gap: var(--gap);
  }
  #girlyanda-catalog-prices .price-strings {
    grid-template-columns: repeat(2, minmax(0, calc((100% - 2 * var(--gap)) / 3)));
    justify-content: center;
    margin-block-end: var(--gap);
  }
  #girlyanda-catalog-prices .preview-product {
    display: grid;
    grid-row: span 4;
    grid-template-rows: subgrid;
    row-gap: 0;
    min-inline-size: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    padding-block-end: var(--card-padding);
  }
  #girlyanda-catalog-prices .preview-cover {
    display: block;
    grid-area: 1 / 1;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--photo-background);
  }
  #girlyanda-catalog-prices .preview-copy {
    grid-area: 2 / 1;
    padding: var(--card-padding) var(--card-padding) 0;
  }
  #girlyanda-catalog-prices .preview-copy h3 {
    color: inherit;
    font: 650 var(--title-size)/1.12 'Girlyanda Manrope', system-ui, sans-serif;
    letter-spacing: -.035em;
    overflow-wrap: anywhere;
    margin: 0;
  }
  #girlyanda-catalog-prices .preview-copy p {
    color: var(--secondary-ink);
    font-size: 12px;
    line-height: 1.35;
    margin: 5px 0 0;
  }
  #girlyanda-catalog-prices .preview-cost {
    grid-area: 3 / 1;
    justify-self: start;
    align-self: end;
    padding: 9px var(--card-padding) 0;
    color: inherit;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  #girlyanda-catalog-prices .preview-options {
    grid-area: 4 / 1;
    display: flex;
    flex-wrap: wrap;
    align-content: start;
    padding: 4px calc(var(--card-padding) - 3px) 0;
  }
  #girlyanda-catalog-prices .preview-options:empty { padding: 0; }
  #girlyanda-catalog-prices .preview-choice {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 25px;
    height: 30px;
    background: transparent;
    border: 0;
    color: inherit;
    padding: 0;
  }
  #girlyanda-catalog-prices .preview-choice::before {
    content: '';
    width: 13px;
    height: 13px;
    border: 1px solid #55453575;
    border-radius: 50%;
    background: var(--swatch);
  }
  #girlyanda-catalog-prices .preview-choice[aria-pressed="true"]::before {
    outline: 1px solid currentColor;
    outline-offset: 2px;
  }
  #girlyanda-catalog-prices .price-first .preview-cost {
    grid-row: 2;
    align-self: start;
  }
  #girlyanda-catalog-prices .price-first .preview-copy { grid-row: 3; }
  #girlyanda-catalog-prices .price-overlay { padding-block-end: calc(var(--gap) + 57.2px); }
  #girlyanda-catalog-prices .price-overlay .preview-cost {
    grid-row: 1;
    align-self: start;
    margin: 8px;
    padding: 3px 8px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  #girlyanda-catalog-prices .price-overlay .preview-options { grid-row: 3; }
  @media (max-width: 520px) {
    #girlyanda-catalog-prices .price-gallery {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    #girlyanda-catalog-prices .price-snow > :nth-child(3) { margin-top: var(--gap); }
    #girlyanda-catalog-prices .price-overlay { padding-block-end: calc(var(--gap) + 85.8px); }
  }
  @media (pointer: coarse) {
    #girlyanda-catalog-prices .preview-choice { width: 44px; height: 44px; }
  }
</style>

<script>
  {
    const root = document.getElementById('girlyanda-catalog-prices');
    const template = root.querySelector('#girlyanda-demo-card');
    const images = JSON.parse(root.querySelector('#girlyanda-demo-images').textContent);
    const glows = [
      ['warm', 'Теплий білий', '#dfab5a'],
      ['white', 'Білий', '#f4f2df'],
      ['orange', 'Помаранчевий', '#e88531'],
      ['red', 'Червоний', '#d74645'],
      ['yellow', 'Жовтий', '#ebcc48'],
      ['blue', 'Синій', '#4f78d0'],
      ['green', 'Зелений', '#4d9b64'],
      ['rgb', 'Різнокольоровий (RGB)', 'conic-gradient(#d98266, #dfb549, #67a08b, #6e80cf, #d98266)'],
    ];
    const strings = [
      {name: 'Гірлянда-нитка 10 м', price: 189341, glows, mode: ''},
      {name: 'Гірлянда-нитка 10 м з мерехтінням', price: 202865, glows: glows.slice(0, 2), mode: '-flash'},
    ];
    const snow = [
      {name: 'Гірлянда «Танучі бурульки» Snowfall, 10 м', detail: '10 підвісів по 50 см · 720 LED', price: 326000, image: 'snowfall-50'},
      {name: 'Гірлянда «Танучі бурульки» Snowfall, 3 м', detail: '10 підвісів по 50 см · 720 LED', price: 270487, image: 'snowfall-50'},
      {name: 'Гірлянда Meteor, 3 м', detail: '10 підвісів по 30 см · 300 LED', price: 180324, image: 'meteor-30'},
    ];
    const formatter = new Intl.NumberFormat('uk-UA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    const formatPrice = kopiykas => formatter.format(kopiykas / 100) + '\u00a0грн';

    function productCard(product, layout) {
      const card = template.content.firstElementChild.cloneNode(true);
      const image = card.querySelector('.preview-cover');
      const copy = card.querySelector('.preview-copy');
      const cost = card.querySelector('.preview-cost');
      const options = card.querySelector('.preview-options');
      copy.querySelector('h3').textContent = product.name;
      if (product.detail) {
        const detail = document.createElement('p');
        detail.textContent = product.detail;
        copy.append(detail);
      }
      const showGlow = (id, label) => {
        image.src = images[product.image ?? ('promin-100-' + id + '-black' + product.mode)];
        image.alt = label ? product.name + ' · ' + label : product.name;
        cost.textContent = formatPrice(id === 'rgb' ? 247946 : product.price);
        for (const control of options.children) {
          control.setAttribute('aria-pressed', String(control.value === id));
        }
      };
      if (product.glows) {
        options.setAttribute('role', 'group');
        options.setAttribute('aria-label', 'Колір світіння · ' + product.name);
        for (const [id, label, color] of product.glows) {
          const control = document.createElement('button');
          control.type = 'button';
          control.className = 'preview-choice cursor-interaction';
          control.value = id;
          control.setAttribute('aria-label', label);
          control.style.setProperty('--swatch', color);
          control.addEventListener('click', () => showGlow(id, label));
          options.append(control);
        }
      }
      if (layout !== 'bottom') copy.before(cost);
      showGlow(product.glows?.[0][0], product.glows?.[0][1]);
      return card;
    }

    for (const stage of root.querySelectorAll('.price-stage')) {
      const layout = stage.classList.contains('price-bottom') ? 'bottom' : 'high';
      stage.querySelector('.price-strings').append(...strings.map(product => productCard(product, layout)));
      stage.querySelector('.price-snow').append(...snow.map(product => productCard(product, layout)));
    }
    if (globalThis.Tweak) {
      for (const stage of root.querySelectorAll('.price-stage')) {
        const spacing = {padding: 14};
        const tweak = new Tweak({
          container: stage, onChange: () => stage.style.setProperty('--card-padding', spacing.padding + 'px'),
        });
        tweak.addSlider(spacing, 'padding', {label: 'Отступ в карточке', min: 9, max: 20, unit: 'px'});
      }
    }
  }
</script>
